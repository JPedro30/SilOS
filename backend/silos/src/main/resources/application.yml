spring:
  application:
    name: silOS

  datasource:
    url: jdbc:postgresql://localhost:5432/silos_db
    username: silos_admin
    password: silos_password123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update # Genera/actualiza las tablas automáticamente según las entidades JPA
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Configuración de OpenAPI / Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html